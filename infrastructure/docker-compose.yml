version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: research_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: research
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: research_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: research_app
    environment:
      DATABASE_URL: postgresql://postgres:1234@postgres:5432/research
      REDIS_URL: redis://redis:6379
      GROQ_API_KEY: ${GROQ_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  streamlit:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.streamlit
    container_name: research_ui
    ports:
      - "8501:8501"
    depends_on:
      - app
    volumes:
      - ../:/app
    environment:
      API_URL: http://app:8000

volumes:
  postgres_data:
  redis_data: