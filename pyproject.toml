[project]
name = "ai-research-agent"
version = "1.0.0"
description = "Multi-agent AI research system"
authors = [{name = "Your Name"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "langchain>=0.1.0",
    "langchain-groq>=0.0.8",
    "langgraph>=0.0.20",
    "crewai>=0.28.3",
    "tavily-python>=0.3.0",
    "chromadb>=0.4.22",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "streamlit>=1.29.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = true